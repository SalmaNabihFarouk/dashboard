    <div class="table-toolbar">
      <div class="filter-group">
        <button mat-stroked-button class="filter-icon">
          <mat-icon>filter_alt</mat-icon>
        </button>
    
        <mat-form-field  class="filter-dropdown">
          <mat-label>User ID</mat-label>
          <mat-select [(value)]="selectedUserId" (selectionChange)="applyFilter()">
            <mat-option *ngFor="let id of uniqueUserIds" [value]="id">{{ id }}</mat-option>
          </mat-select>
        </mat-form-field>
    
        <button mat-button class="reset-filter" (click)="resetFilter()">
          <mat-icon>refresh</mat-icon> Reset Filter
        </button>
      </div>
    
      <button mat-stroked-button color="primary" class="add-button" routerLink="/create">
        <mat-icon>add</mat-icon> Add
      </button>
    </div>
    
    <table mat-table [dataSource]="dataSource" class="mat-table">
  
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let post"> {{post.id}} </td>
      </ng-container>
  
      <ng-container matColumnDef="userId">
        <th mat-header-cell *matHeaderCellDef> User Id</th>
        <td mat-cell *matCellDef="let post"> {{post.userId}} </td>
      </ng-container>
  
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> title</th>
        <td mat-cell *matCellDef="let post"> {{post.title}} </td>
      </ng-container>
  
      <ng-container matColumnDef="body">
        <th mat-header-cell *matHeaderCellDef> body</th>
        <td mat-cell *matCellDef="let post"> {{post.body}} </td>
      </ng-container>
  
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef> operation</th>
        <td mat-cell *matCellDef="let post">
          <button mat-icon-button color="primary" [routerLink]="['/posts',post.id]">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(post.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    </table>
  
    <!-- <mat-paginator [length]="totalLength" [pageSize]="9" [pageSizeOptions]="[9, 18, 27]">
    </mat-paginator> -->
    <div class="paginator-wrapper">
      <mat-paginator
        [length]="totalLength"
        [pageSize]="9"
        [pageSizeOptions]="[9, 18, 27]"
        showFirstLastButtons>
      </mat-paginator>
    </div>
  </div>
