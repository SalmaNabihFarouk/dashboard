<div class="table-container mat-elevation-z8">
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="filter-dropdown">
        <mat-label> user id</mat-label>
        <mat-select [(value)]="selectedUserId" (selectionChange)="applyFilter()">
          <mat-option *ngFor="let id of uniqueUserIds" [value]="id">{{ id }}</mat-option>
        </mat-select>
      </mat-form-field>
  
      <button mat-stroked-button color="warn" (click)="resetFilter()">reset filter</button>
  
      <span class="spacer"></span>
      <button mat-raised-button color="primary" routerLink="/create">Add</button>
    </div>
  
    <table mat-table [dataSource]="dataSource" class="mat-table">
  
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let post"> {{post.id}} </td>
      </ng-container>
  
      <ng-container matColumnDef="userId">
        <th mat-header-cell *matHeaderCellDef> User Id</th>
        <td mat-cell *matCellDef="let post"> {{post.userId}} </td>
      </ng-container>
  
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> title</th>
        <td mat-cell *matCellDef="let post"> {{post.title}} </td>
      </ng-container>
  
      <ng-container matColumnDef="body">
        <th mat-header-cell *matHeaderCellDef> body</th>
        <td mat-cell *matCellDef="let post"> {{post.body}} </td>
      </ng-container>
  
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef> operation</th>
        <td mat-cell *matCellDef="let post">
          <button mat-icon-button color="primary" [routerLink]="['/posts',post.id]">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(post.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    </table>
  
    <mat-paginator [length]="totalLength" [pageSize]="9" [pageSizeOptions]="[9, 18, 27]">
    </mat-paginator>
  </div>
