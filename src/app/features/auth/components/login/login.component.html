<div class="login-container">
    <form [formGroup]="loginForm" class="login-form">
      <h2>Login to Account</h2>
      <p>Please enter your email and password to continue</p>
  
      <span *ngIf="errorMessage" class="error-message">{{ errorMessage }}</span>
  
      <label>Email address:</label>
      <input formControlName="email" type="email" placeholder="esteban_schiller@gmail.com"  id="email"  />
 
      <div class=" " *ngIf="loginForm.get('email')?.errors&&loginForm.get('email')?.touched ">
    
        <p *ngIf="loginForm.get('email')?.getError('required')" class="text-danger ">email is Required</p>
        <p *ngIf="loginForm.get('email')?.getError('email')" class="text-danger ">InValid Format</p>
    
            </div>
      <div class="password-label">
        <label>Password</label>
        <a href="#">Forget Password?</a>
      </div>
      <input formControlName="password" type="password" placeholder="●●●●●●●"  id="password"/>
      <div class="" *ngIf="loginForm.get('password')?.errors&&loginForm.get('password')?.touched ">
    
        <p *ngIf="loginForm.get('password')?.getError('required')"  class="text-danger ">password is Required</p>
        <p *ngIf="loginForm.get('password')?.getError('pattern')" class="text-danger ">
     password Must be at least 6 characters and include at least one letter.</p>
    
            </div>
      <div class="remember-row">
        <input type="checkbox" id="remember" />
        <label for="remember">Remember Password</label>
      </div>
  
      <button type="button" (click)="login()">Sign In</button>
  
      <p class="create-account">
        Don’t have an account? <a href="#">Create Account</a>
      </p>
    </form>
  </div>
